name: CI

on:
  push:
    branches: [ main, phase-* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      BUILD_TYPE: Debug

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 with GCC 13+ for full C++20 std::format support
          - os: ubuntu-24.04
            compiler: gcc
            triplet: x64-linux
          # Ubuntu 24.04 with Clang 18 for full C++20 std::format support
          - os: ubuntu-24.04
            compiler: clang
            triplet: x64-linux
          # macOS 14 (Sonoma) with latest Apple Clang
          - os: macos-14
            compiler: clang
            triplet: arm64-osx
          # Windows 2022 with MSVC (already supports std::format)
          - os: windows-2022
            compiler: msvc
            triplet: x64-windows

    steps:
    - name: Checkout database_system
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Checkout common_system
      uses: actions/checkout@v6
      with:
        repository: kcenon/common_system
        path: common_system
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout thread_system
      uses: actions/checkout@v6
      with:
        repository: kcenon/thread_system
        path: thread_system
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout logger_system
      uses: actions/checkout@v6
      with:
        repository: kcenon/logger_system
        path: logger_system
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout container_system
      uses: actions/checkout@v6
      with:
        repository: kcenon/container_system
        path: container_system
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout monitoring_system
      uses: actions/checkout@v6
      with:
        repository: kcenon/monitoring_system
        path: monitoring_system
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # Ubuntu 24.04 provides GCC 13 and Clang 18 by default
        # These versions fully support C++20 std::format
        sudo apt-get install -y cmake ninja-build g++-13 clang-18 pkg-config curl zip unzip tar autoconf automake autoconf-archive

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja pkg-config curl zip unzip autoconf automake autoconf-archive

    - name: Setup Visual Studio (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v3
      with:
        vs-version: '17.0'
        msbuild-architecture: x64

    - name: Set up compiler (GCC)
      if: matrix.compiler == 'gcc'
      run: |
        # Use GCC 13 for full C++20 std::format support
        echo "CC=gcc-13" >> $GITHUB_ENV
        echo "CXX=g++-13" >> $GITHUB_ENV

    - name: Set up compiler (Clang - Linux)
      if: matrix.compiler == 'clang' && runner.os == 'Linux'
      run: |
        # Use Clang 18 for full C++20 std::format support
        echo "CC=clang-18" >> $GITHUB_ENV
        echo "CXX=clang++-18" >> $GITHUB_ENV

    - name: Set up compiler (Clang - macOS)
      if: matrix.compiler == 'clang' && runner.os == 'macOS'
      run: |
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV

    - name: Set up compiler (MSVC)
      if: matrix.compiler == 'msvc'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Check architecture (Linux)
      if: runner.os == 'Linux'
      run: |
        if [ "$(uname -m)" = "aarch64" ]; then
          echo "VCPKG_FORCE_SYSTEM_BINARIES=arm" >> $GITHUB_ENV
        fi

    - name: Setup vcpkg
      uses: kcenon/common_system/.github/actions/setup-vcpkg@main
      with:
        extra-cache-key: 'database-system'

    - name: Cache vcpkg installed
      uses: actions/cache@v5
      id: vcpkg-installed
      with:
        path: ${{ github.workspace }}/vcpkg_installed
        key: ${{ runner.os }}-${{ matrix.compiler }}-vcpkg-installed-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler }}-vcpkg-installed-${{ matrix.triplet }}-

    - name: Install dependencies with vcpkg (Unix)
      if: runner.os != 'Windows' && steps.vcpkg-installed.outputs.cache-hit != 'true'
      run: |
        ${{ env.VCPKG_ROOT }}/vcpkg install --x-manifest-root=. --x-install-root=${{ github.workspace }}/vcpkg_installed --triplet ${{ matrix.triplet }}

    - name: Install dependencies with vcpkg (Windows)
      if: runner.os == 'Windows' && steps.vcpkg-installed.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        ${{ env.VCPKG_ROOT }}\vcpkg install --x-manifest-root=. --x-install-root=${{ github.workspace }}\vcpkg_installed --triplet ${{ matrix.triplet }}

    - name: Prepare build directory
      if: runner.os != 'Windows'
      run: |
        rm -rf build
        mkdir -p build

    - name: Prepare build directory (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Test-Path build) { Remove-Item -Recurse -Force build }
        New-Item -ItemType Directory -Path build

    - name: Build application (vcpkg - Unix)
      if: runner.os != 'Windows'
      id: build_vcpkg_unix
      continue-on-error: true
      run: |
        cd build
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}" \
          -DALLOW_BUILD_WITHOUT_NETWORK_SYSTEM=ON \
          -DUSE_THREAD_SYSTEM=OFF \
          -DUSE_MONITORING_SYSTEM=OFF \
          -DUSE_CONTAINER_SYSTEM=OFF \
          -DUSE_UNIT_TEST=ON \
          -DBUILD_DATABASE_SAMPLES=ON \
          -DDATABASE_BUILD_INTEGRATION_TESTS=OFF \
          -DUSE_POSTGRESQL=OFF

        cmake --build . --parallel
        ctest -C $BUILD_TYPE --output-on-failure --timeout 30

    - name: Build application (vcpkg - Windows)
      if: runner.os == 'Windows'
      id: build_vcpkg_windows
      continue-on-error: true
      shell: pwsh
      run: |
        cd build
        $env:CMAKE_CXX_FLAGS = "/std:c++20 /permissive- /Zc:__cplusplus /EHsc"
        $env:CMAKE_TRY_COMPILE_TARGET_TYPE = "STATIC_LIBRARY"

        cmake .. `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}" `
          -DALLOW_BUILD_WITHOUT_NETWORK_SYSTEM=ON `
          -DUSE_THREAD_SYSTEM=OFF `
          -DUSE_MONITORING_SYSTEM=OFF `
          -DUSE_CONTAINER_SYSTEM=OFF `
          -DUSE_UNIT_TEST=ON `
          -DBUILD_DATABASE_SAMPLES=ON `
          -DDATABASE_BUILD_INTEGRATION_TESTS=OFF `
          -DUSE_POSTGRESQL=OFF `
          -DCMAKE_CXX_FLAGS="/std:c++20 /permissive- /Zc:__cplusplus /EHsc" `
          -DCMAKE_TRY_COMPILE_TARGET_TYPE="STATIC_LIBRARY"

        cmake --build . --config $env:BUILD_TYPE --parallel
        ctest -C $env:BUILD_TYPE --output-on-failure --timeout 30

    - name: Build application (fallback - Unix)
      if: runner.os != 'Windows' && steps.build_vcpkg_unix.outcome != 'success'
      run: |
        echo "vcpkg build failed. Falling back to system libraries..."
        rm -rf build
        mkdir -p build
        cd build

        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DALLOW_BUILD_WITHOUT_NETWORK_SYSTEM=ON \
          -DUSE_THREAD_SYSTEM=OFF \
          -DUSE_MONITORING_SYSTEM=OFF \
          -DUSE_CONTAINER_SYSTEM=OFF \
          -DUSE_UNIT_TEST=ON \
          -DBUILD_DATABASE_SAMPLES=ON \
          -DDATABASE_BUILD_INTEGRATION_TESTS=OFF \
          -DUSE_POSTGRESQL=OFF

        cmake --build . --parallel

    - name: Build application (fallback - Windows)
      if: runner.os == 'Windows' && steps.build_vcpkg_windows.outcome != 'success'
      shell: pwsh
      run: |
        Write-Host "vcpkg build failed. Falling back to system libraries..."
        if (Test-Path build) { Remove-Item -Recurse -Force build }
        New-Item -ItemType Directory -Path build
        cd build

        $env:CMAKE_CXX_FLAGS = "/std:c++20 /permissive- /Zc:__cplusplus /EHsc"
        $env:CMAKE_TRY_COMPILE_TARGET_TYPE = "STATIC_LIBRARY"

        cmake .. `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DALLOW_BUILD_WITHOUT_NETWORK_SYSTEM=ON `
          -DUSE_THREAD_SYSTEM=OFF `
          -DUSE_MONITORING_SYSTEM=OFF `
          -DUSE_CONTAINER_SYSTEM=OFF `
          -DUSE_UNIT_TEST=ON `
          -DBUILD_DATABASE_SAMPLES=ON `
          -DDATABASE_BUILD_INTEGRATION_TESTS=OFF `
          -DUSE_POSTGRESQL=OFF `
          -DCMAKE_CXX_FLAGS="/std:c++20 /permissive- /Zc:__cplusplus /EHsc" `
          -DCMAKE_TRY_COMPILE_TARGET_TYPE="STATIC_LIBRARY" `
          -DNO_VCPKG=ON

        cmake --build . --config $env:BUILD_TYPE --parallel

    - name: Run minimal test (fallback - Unix)
      if: runner.os != 'Windows' && steps.build_vcpkg_unix.outcome != 'success'
      run: |
        cd build
        ctest -C $BUILD_TYPE --output-on-failure --timeout 30 || true
        echo "Build completed with system libraries"

    - name: Run minimal test (fallback - Windows)
      if: runner.os == 'Windows' && steps.build_vcpkg_windows.outcome != 'success'
      shell: pwsh
      run: |
        cd build
        ctest -C $env:BUILD_TYPE --output-on-failure --timeout 30
        exit 0

    - name: Upload build artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ matrix.os }}-${{ matrix.compiler }}-logs
        path: |
          build/CMakeFiles/*.log
          build/Testing/Temporary/

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - name: ThreadSanitizer
            flags: "-fsanitize=thread -g -O1"
            env: "TSAN_OPTIONS=second_deadlock_stack=1"
          - name: AddressSanitizer
            flags: "-fsanitize=address -fno-omit-frame-pointer -g -O1"
            env: "ASAN_OPTIONS=detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1"
          - name: UndefinedBehaviorSanitizer
            flags: "-fsanitize=undefined -fno-omit-frame-pointer -g -O1"
            env: "UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=0"

    steps:
    - name: Checkout database_system
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Checkout common_system
      uses: actions/checkout@v6
      with:
        repository: kcenon/common_system
        path: common_system
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout thread_system
      uses: actions/checkout@v6
      with:
        repository: kcenon/thread_system
        path: thread_system
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout logger_system
      uses: actions/checkout@v6
      with:
        repository: kcenon/logger_system
        path: logger_system
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout container_system
      uses: actions/checkout@v6
      with:
        repository: kcenon/container_system
        path: container_system
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout monitoring_system
      uses: actions/checkout@v6
      with:
        repository: kcenon/monitoring_system
        path: monitoring_system
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        # Use Clang 18 for full C++20 std::format support with sanitizers
        sudo apt-get install -y cmake ninja-build clang-18 libgtest-dev libgmock-dev pkg-config

    - name: Build and install common_system
      run: |
        cd common_system
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DUSE_UNIT_TEST=OFF \
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
        cmake --build build --config Release
        sudo cmake --install build --prefix /usr/local

    - name: Configure CMake with ${{ matrix.sanitizer.name }}
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DALLOW_BUILD_WITHOUT_NETWORK_SYSTEM=ON \
          -DUSE_THREAD_SYSTEM=OFF \
          -DUSE_MONITORING_SYSTEM=OFF \
          -DUSE_CONTAINER_SYSTEM=OFF \
          -DUSE_UNIT_TEST=ON \
          -DBUILD_DATABASE_SAMPLES=ON \
          -DDATABASE_BUILD_INTEGRATION_TESTS=OFF \
          -DUSE_POSTGRESQL=OFF \
          -DCMAKE_C_COMPILER=clang-18 \
          -DCMAKE_CXX_COMPILER=clang++-18 \
          -DCMAKE_C_FLAGS="${{ matrix.sanitizer.flags }}" \
          -DCMAKE_CXX_FLAGS="${{ matrix.sanitizer.flags }}" \
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.sanitizer.flags }}" \
          -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.sanitizer.flags }}"

    - name: Build with ${{ matrix.sanitizer.name }}
      run: cmake --build build --config Debug --parallel

    - name: Run tests with ${{ matrix.sanitizer.name }}
      timeout-minutes: 10
      run: |
        cd build
        export ${{ matrix.sanitizer.env }}
        # Run with timeout to prevent hanging
        ctest -C Debug --output-on-failure --timeout 60

    - name: Upload sanitizer logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sanitizer-${{ matrix.sanitizer.name }}-logs
        path: |
          build/Testing/
          build/**/*.log
        retention-days: 7
