# Codecov Configuration for database_system
# https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: 55%  # Phase 1: Establish realistic baseline
        threshold: 2%
        if_ci_failed: error
        informational: true  # Don't block PRs on coverage status

    patch:
      default:
        target: 60%
        threshold: 5%
        informational: true

# Gradual improvement plan:
# - Phase 1 (Current): 55% project, 60% patch - Establish baseline
# - Phase 2: 65% project, 70% patch - Increase coverage
# - Phase 3: 75% project, 80% patch - Production-grade coverage

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: no
  require_base: false
  require_head: true

flags:
  unittests:
    paths:
      - database/
    carryforward: true

ignore:
  - "tests/**"
  - "integration_tests/**"
  - "third_party/**"
  - "samples/**"
  - "benchmarks/**"
  - "build/**"
  - "build_*/**"
  - "build-*/**"
  - "docs/**"
  - "cmake/**"
  - "scripts/**"
  - "common_system/**"
  - "**/*.md"
  - "**/CMakeLists.txt"
