name: Dependency Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies for analysis
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v3
        id: vcpkg-cache
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            !${{ github.workspace }}/vcpkg/buildtrees
            !${{ github.workspace }}/vcpkg/packages
            !${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-security-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-security-${{ runner.os }}-
            vcpkg-${{ runner.os }}-

      - name: Install vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh

      - name: Integrate vcpkg
        run: |
          if [ -d "vcpkg" ]; then
            cd vcpkg
            git pull
            ./vcpkg integrate install
          fi

      - name: Generate dependency list
        run: |
          # Create a basic CMake configuration to discover dependencies
          mkdir -p security_scan_build
          cd security_scan_build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DUSE_POSTGRESQL=ON \
            -DBUILD_DATABASE_SAMPLES=OFF \
            -DUSE_UNIT_TEST=OFF
          cd ..

          # Extract dependency information
          echo "# Database System Dependencies" > DEPENDENCIES.md
          echo "" >> DEPENDENCIES.md
          echo "## Direct Dependencies" >> DEPENDENCIES.md
          if [ -f "vcpkg.json" ]; then
            echo "From vcpkg.json:" >> DEPENDENCIES.md
            cat vcpkg.json >> DEPENDENCIES.md
          fi
          echo "" >> DEPENDENCIES.md

          # List installed vcpkg packages
          if [ -d "vcpkg" ]; then
            echo "## Installed vcpkg packages:" >> DEPENDENCIES.md
            cd vcpkg
            ./vcpkg list || echo "No packages installed yet" >> ../DEPENDENCIES.md
            cd ..
          fi

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: cpp
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:cpp"

      - name: Check for known vulnerabilities in vcpkg
        if: always()
        run: |
          echo "🔍 Checking vcpkg packages for known vulnerabilities..."

          # Check if vcpkg has any security advisories
          if [ -d "vcpkg" ]; then
            cd vcpkg

            # Update to latest to get security patches
            git fetch origin
            git log --oneline -10 | grep -i -E "(security|cve|vulnerability)" || echo "No recent security commits found"

            # List all installed packages with versions
            echo "📦 Installed packages:"
            ./vcpkg list --triplet=x64-linux || echo "No packages installed"

            cd ..
          fi

      - name: Upload dependency list
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dependency-analysis
          path: |
            DEPENDENCIES.md
            security_scan_build/CMakeCache.txt

      - name: Security Summary
        if: always()
        run: |
          echo "## 🛡️ Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CodeQL analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency scan completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ vcpkg security check completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 See artifacts for detailed dependency information" >> $GITHUB_STEP_SUMMARY