name: Code Coverage

on:
  push:
    branches: [ main, phase-* ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout database_system
      uses: actions/checkout@v4
      with:
        path: database_system

    - name: Checkout common_system (Tier 0)
      uses: actions/checkout@v4
      with:
        repository: kcenon/common_system
        path: common_system

    - name: Checkout thread_system (Tier 1)
      uses: actions/checkout@v4
      with:
        repository: kcenon/thread_system
        path: thread_system

    - name: Checkout container_system (Tier 1)
      uses: actions/checkout@v4
      with:
        repository: kcenon/container_system
        path: container_system

    - name: Checkout logger_system (Tier 1)
      uses: actions/checkout@v4
      with:
        repository: kcenon/logger_system
        path: logger_system

    - name: Checkout monitoring_system (Tier 1)
      uses: actions/checkout@v4
      with:
        repository: kcenon/monitoring_system
        path: monitoring_system

    - name: Checkout network_system (Tier 2)
      uses: actions/checkout@v4
      with:
        repository: kcenon/network_system
        path: network_system

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++ libgtest-dev libgmock-dev lcov pkg-config libfmt-dev

    - name: Detect C++ standard from database_system
      run: |
        CXX_STD=$(grep "set(CMAKE_CXX_STANDARD" database_system/CMakeLists.txt | head -1 | grep -o '[0-9]\+')
        echo "CXX_STANDARD=${CXX_STD}" >> $GITHUB_ENV
        echo "Detected C++ standard: ${CXX_STD}"

    - name: Build Tier 0 - common_system
      run: |
        cd common_system
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF
        cmake --build build

    - name: Build Tier 1 - thread_system
      run: |
        cd thread_system
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF
        cmake --build build

    - name: Build Tier 1 - container_system
      run: |
        cd container_system
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF
        cmake --build build

    - name: Build Tier 1 - logger_system
      run: |
        cd logger_system
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF
        cmake --build build

    - name: Build Tier 1 - monitoring_system
      run: |
        cd monitoring_system
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF
        cmake --build build

    - name: Build Tier 2 - network_system
      run: |
        cd network_system
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_SAMPLES=OFF
        cmake --build build

    - name: Configure CMake with coverage
      run: |
        cd database_system
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
          -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
          -DUSE_UNIT_TEST=ON \
          -DBUILD_DATABASE_SAMPLES=ON \
          -DDATABASE_BUILD_INTEGRATION_TESTS=OFF \
          -DUSE_POSTGRESQL=OFF

    - name: Build with coverage
      run: |
        cd database_system
        cmake --build build --config Debug

    - name: Run tests
      timeout-minutes: 5
      run: |
        cd database_system/build
        # Run tests with timeout to prevent hanging
        ctest -C Debug --output-on-failure --timeout 30 || true

    - name: Generate coverage report
      run: |
        cd database_system/build
        # Capture coverage data
        # Ubuntu 22.04 lcov 1.14 only supports --ignore-errors source
        lcov --directory . --capture --output-file coverage.info --ignore-errors source --rc lcov_branch_coverage=0 2>/dev/null || \
          lcov --directory . --capture --output-file coverage.info 2>/dev/null || true

        # Filter out system headers and test files
        if [ -f coverage.info ]; then
          lcov --remove coverage.info '/usr/*' '*/test/*' '*/tests/*' '*/examples/*' '*/samples/*' '*/googletest/*' \
            --output-file coverage_filtered.info --ignore-errors source 2>/dev/null || true

          # Generate HTML report
          if [ -f coverage_filtered.info ]; then
            genhtml coverage_filtered.info --output-directory coverage_html --ignore-errors source 2>/dev/null || \
              echo "⚠️  HTML coverage report generation skipped"

            # Print summary
            lcov --list coverage_filtered.info --ignore-errors source 2>/dev/null || \
              echo "⚠️  Coverage summary generation skipped"
          fi
        else
          echo "⚠️  Coverage data file not created"
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./database_system/build/coverage_filtered.info
        flags: unittests
        name: database_system-coverage
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          database_system/build/coverage.info
          database_system/build/coverage_filtered.info
          database_system/build/coverage_html/
        retention-days: 7

    - name: Coverage summary
      if: always()
      run: |
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f database_system/build/coverage_filtered.info ]; then
          echo "Coverage data collected successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Phase 0 Target: Establish baseline coverage" >> $GITHUB_STEP_SUMMARY
          echo "Phase 5 Target: 80%+ coverage" >> $GITHUB_STEP_SUMMARY
        else
          echo "No coverage data generated." >> $GITHUB_STEP_SUMMARY
        fi
