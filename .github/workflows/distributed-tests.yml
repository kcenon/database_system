name: Distributed Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  distributed-tests:
    name: Multi-Node Distributed Tests
    # Ubuntu 24.04 for full C++20 std::format support with GCC 13
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout common_system
        uses: actions/checkout@v4
        with:
          repository: kcenon/common_system
          path: common_system
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Use GCC 13 for full C++20 std::format support
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++-13 \
            libpq-dev \
            libmysqlclient-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libgtest-dev \
            libgmock-dev \
            nlohmann-json3-dev

      - name: Build and install common_system
        run: |
          cd common_system
          # Use GCC 13 for full C++20 std::format support
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DUSE_UNIT_TEST=OFF \
            -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build --config Release
          sudo cmake --install build --prefix /usr/local

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test cluster
        run: |
          docker compose -f docker-compose.distributed-test.yml up -d
          echo "Waiting for services to be ready..."
          sleep 30

      - name: Wait for all services
        run: |
          chmod +x ./scripts/wait-for-services.sh
          ./scripts/wait-for-services.sh

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DENABLE_DISTRIBUTED_TESTS=ON \
            -DENABLE_TESTING=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DALLOW_BUILD_WITHOUT_NETWORK_SYSTEM=ON

      - name: Build project
        run: cmake --build build --parallel $(nproc)

      - name: Run distributed tests
        working-directory: build
        run: |
          ctest -R "distributed" -V --timeout 300 --output-on-failure
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: Collect Docker logs
        if: failure()
        run: |
          docker compose -f docker-compose.distributed-test.yml logs > distributed-test-logs.txt
          docker ps -a

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-test-logs
          path: distributed-test-logs.txt
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-test-results
          path: |
            build/Testing/
            build/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.distributed-test.yml down -v
          docker system prune -f

  chaos-engineering:
    name: Chaos Engineering Tests
    # Ubuntu 24.04 for full C++20 std::format support with GCC 13
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Only run on schedule or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout common_system
        uses: actions/checkout@v4
        with:
          repository: kcenon/common_system
          path: common_system
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Use GCC 13 for full C++20 std::format support
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++-13 \
            libpq-dev \
            libmysqlclient-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libgtest-dev

      - name: Build and install common_system
        run: |
          cd common_system
          # Use GCC 13 for full C++20 std::format support
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DUSE_UNIT_TEST=OFF \
            -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build --config Release
          sudo cmake --install build --prefix /usr/local

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test cluster with Toxiproxy
        run: |
          docker compose -f docker-compose.distributed-test.yml up -d
          ./scripts/wait-for-services.sh

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DENABLE_DISTRIBUTED_TESTS=ON \
            -DENABLE_CHAOS_TESTS=ON \
            -DENABLE_TESTING=ON \
            -DALLOW_BUILD_WITHOUT_NETWORK_SYSTEM=ON

      - name: Build project
        run: cmake --build build --parallel $(nproc)

      - name: Run chaos engineering tests
        working-directory: build
        run: |
          ctest -R "chaos|partition|failover" -V --timeout 600
        env:
          ENABLE_TOXIPROXY: "true"

      - name: Collect logs
        if: always()
        run: |
          docker compose -f docker-compose.distributed-test.yml logs > chaos-test-logs.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-test-logs
          path: chaos-test-logs.txt
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.distributed-test.yml down -v
          docker system prune -f

  performance-benchmarks:
    name: Distributed Performance Benchmarks
    # Ubuntu 24.04 for full C++20 std::format support with GCC 13
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Only run on schedule
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout common_system
        uses: actions/checkout@v4
        with:
          repository: kcenon/common_system
          path: common_system
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Use GCC 13 for full C++20 std::format support
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++-13 \
            libpq-dev \
            libmysqlclient-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            libgtest-dev

      - name: Build and install common_system
        run: |
          cd common_system
          # Use GCC 13 for full C++20 std::format support
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DUSE_UNIT_TEST=OFF \
            -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          cmake --build build --config Release
          sudo cmake --install build --prefix /usr/local

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test cluster
        run: |
          docker compose -f docker-compose.distributed-test.yml up -d
          ./scripts/wait-for-services.sh

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DENABLE_DISTRIBUTED_TESTS=ON \
            -DENABLE_BENCHMARKS=ON \
            -DENABLE_TESTING=ON \
            -DALLOW_BUILD_WITHOUT_NETWORK_SYSTEM=ON

      - name: Build project
        run: cmake --build build --parallel $(nproc)

      - name: Run performance benchmarks
        working-directory: build
        run: |
          ctest -R "benchmark" -V --timeout 600

      - name: Generate benchmark report
        if: always()
        run: |
          echo "# Distributed System Benchmarks" > benchmark-report.md
          echo "" >> benchmark-report.md
          echo "Run date: $(date)" >> benchmark-report.md
          echo "" >> benchmark-report.md
          cat build/Testing/Temporary/LastTest.log >> benchmark-report.md

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-report.md
            build/Testing/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.distributed-test.yml down -v
          docker system prune -f
