# Codecov Configuration for database_system
# See: https://docs.codecov.io/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: 55%  # Phase 1: Establish realistic baseline
        threshold: 2%
        if_ci_failed: error

    patch:
      default:
        target: 60%
        threshold: 5%

# Gradual improvement plan:
# - Phase 1 (Current): 55% project, 60% patch - Establish baseline
# - Phase 2: 65% project, 70% patch - Increase coverage
# - Phase 3: 75% project, 80% patch - Production-grade coverage

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

flags:
  database:
    paths:
      - database/
    carryforward: true

  integration:
    paths:
      - integration_tests/
    carryforward: true

ignore:
  - "tests/**/*"
  - "third_party/**/*"
  - "samples/**/*"
  - "benchmarks/**/*"
  - "build/**/*"
  - "**/*.md"
  - "**/CMakeLists.txt"

fixes:
  - "::database_system/database/::database/"
