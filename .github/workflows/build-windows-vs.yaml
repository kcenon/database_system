name: Build-Windows-VisualStudio

on:
  push:
    branches:
      - main
      - feature/*
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows_vs:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_FEATURE_FLAGS: "manifests,registries,versions,binarycaching"
      VCPKG_DEFAULT_TRIPLET: x64-windows
    strategy:
      matrix:
        postgresql: [ON, OFF]
    name: "VS2022-Debug-PostgreSQL-${{ matrix.postgresql }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
          clean: true
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Visual Studio 2022
        uses: microsoft/setup-msbuild@v1.3
        with:
          vs-version: '[17.0,18.0)'

      - name: Cache vcpkg
        uses: actions/cache@v3
        id: vcpkg-cache
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            !${{ github.workspace }}/vcpkg/buildtrees
            !${{ github.workspace }}/vcpkg/packages
            !${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-windows-vs2022-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-vs2022-
            vcpkg-windows-

      - name: Install vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat

      - name: Integrate vcpkg
        run: |
          if (Test-Path "vcpkg") {
            cd vcpkg
            git pull
            .\vcpkg integrate install
          }

      - name: Install PostgreSQL for Windows
        if: matrix.postgresql == 'ON'
        run: |
          choco install postgresql --params '/Password:test_pass' -y
          # Wait for PostgreSQL to start
          Start-Sleep -Seconds 30

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: |
            build
            !build/vcpkg_installed
          key: cmake-windows-vs2022-debug-${{ matrix.postgresql }}-${{ hashFiles('CMakeLists.txt', 'database/CMakeLists.txt') }}
          restore-keys: |
            cmake-windows-vs2022-debug-${{ matrix.postgresql }}-
            cmake-windows-vs2022-debug-
            cmake-windows-vs2022-

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DUSE_POSTGRESQL=${{ matrix.postgresql }} `
            -DBUILD_DATABASE_SAMPLES=ON `
            -DUSE_UNIT_TEST=ON `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cmake --build build --config Debug --parallel

      - name: Setup PostgreSQL database for testing
        if: matrix.postgresql == 'ON'
        run: |
          # Setup PATH for PostgreSQL tools
          $env:PATH = "C:\Program Files\PostgreSQL\14\bin;$env:PATH"

          # Create test database and user
          & "C:\Program Files\PostgreSQL\14\bin\createdb.exe" -U postgres test_db
          & "C:\Program Files\PostgreSQL\14\bin\psql.exe" -U postgres -c "CREATE USER test_user WITH PASSWORD 'test_pass';"
          & "C:\Program Files\PostgreSQL\14\bin\psql.exe" -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE test_db TO test_user;"
        env:
          PGPASSWORD: test_pass

      - name: Test without PostgreSQL
        if: matrix.postgresql == 'OFF'
        run: |
          cd build
          ctest --output-on-failure -C Debug

      - name: Test with PostgreSQL
        if: matrix.postgresql == 'ON'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_pass
          PGPASSWORD: test_pass
        run: |
          cd build
          ctest --output-on-failure -C Debug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: database-system-vs2022-debug-postgresql-${{ matrix.postgresql }}-windows
          path: |
            build/bin/Debug/
            build/lib/Debug/
            build/Debug/
            !build/**/*.pdb