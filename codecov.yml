# Codecov Configuration for database_system
# See: https://docs.codecov.io/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: error

    patch:
      default:
        target: 80%
        threshold: 5%

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

flags:
  database:
    paths:
      - database/
    carryforward: true

  integration:
    paths:
      - integration_tests/
    carryforward: true

ignore:
  - "tests/**/*"
  - "third_party/**/*"
  - "samples/**/*"
  - "benchmarks/**/*"
  - "build/**/*"
  - "**/*.md"
  - "**/CMakeLists.txt"

fixes:
  - "::database_system/database/::database/"
