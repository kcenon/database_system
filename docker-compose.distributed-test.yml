version: '3.8'

services:
  # PostgreSQL Primary Node
  postgres-primary:
    image: postgres:15
    container_name: db-postgres-primary
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: |
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data

  # PostgreSQL Replica 1
  postgres-replica1:
    image: postgres:15
    container_name: db-postgres-replica1
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-replica1-data:/var/lib/postgresql/data

  # PostgreSQL Replica 2
  postgres-replica2:
    image: postgres:15
    container_name: db-postgres-replica2
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-replica2-data:/var/lib/postgresql/data

  # MySQL Node
  mysql-node:
    image: mysql:8.0
    container_name: db-mysql-node
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: testdb
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    ports:
      - "3306:3306"
    networks:
      - db_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "test", "-ptest"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql

  # Toxiproxy for network fault injection
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.5.0
    container_name: db-toxiproxy
    ports:
      - "8474:8474"  # API port
      - "5435:5435"  # Proxied postgres-primary
      - "5436:5436"  # Proxied postgres-replica1
      - "5437:5437"  # Proxied postgres-replica2
      - "3307:3307"  # Proxied mysql-node
    networks:
      - db_network
    depends_on:
      - postgres-primary
      - postgres-replica1
      - postgres-replica2
      - mysql-node

networks:
  db_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-primary-data:
  postgres-replica1-data:
  postgres-replica2-data:
  mysql-data:
